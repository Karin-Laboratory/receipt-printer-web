name: generic-ipp-gateway

on:
  push:
    paths:
      - "generic-ipp-gateway/**"
      - ".github/workflows/generic-ipp-gateway.yml"
  pull_request:
    paths:
      - "generic-ipp-gateway/**"
      - ".github/workflows/generic-ipp-gateway.yml"

permissions:
  contents: read

jobs:
  capture-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpappl-dev poppler-utils cups-ipp-utils python3-pil python3-qrcode fonts-unifont
      - name: Build
        working-directory: generic-ipp-gateway
        run: make
      - name: Static analysis and capture-only guard
        working-directory: generic-ipp-gateway
        run: make analyze check-capture-only
      - name: IPP and ESC/POS integration tests
        working-directory: generic-ipp-gateway
        run: make test
