<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Printer</title>
  <style>
    body { font: 1rem system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    textarea { box-sizing: border-box; width: 100%; min-height: 16rem; padding: .75rem; font: 1rem monospace; }
    button { margin-top: .75rem; padding: .6rem 1rem; cursor: pointer; }
    #status { min-height: 1.5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Receipt Printer</h1>
  <p>Enter text and send it to the configured network thermal printer.</p>
  <form id="print-form">
    <label for="text">Receipt text</label>
    <textarea id="text" name="text" maxlength="4000" required></textarea>
    <button type="submit">Print</button>
  </form>
  <p id="status" role="status"></p>
  <script>
    document.querySelector("#print-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.querySelector("#status");
      status.textContent = "Sending…";
      const response = await fetch("/print", { method: "POST", body: new FormData(event.target) });
      const result = await response.json();
      status.textContent = result.status === "printed" ? "Sent to printer." : result.error;
    });
  </script>
</body>
</html>
